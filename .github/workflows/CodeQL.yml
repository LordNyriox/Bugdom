name: "CodeQL"

on:
  push:
    branches:
      - extreme
      - test
#  pull_request:
#    branches: [ "extreme" ]
#  schedule:
#    - cron: '32 12 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.platform.os }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp', 'python' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
        platform:
          - { name: Linux/GCC, os: ubuntu-latest }
          - { name: Linux/Clang, os: ubuntu-latest, prefix: "CC=clang CXX=clang++"}
          - { name: Windows/VS2022, os: windows-2022, extraflags: "-G 'Visual Studio 17 2022'" }
          - { name: Mac, os: macos-latest }

    steps:
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y libasound2-dev libpulse-dev \
          libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev \
          desktop-file-utils

    - uses: actions/checkout@v5
      with: {submodules: 'recursive'}
    - name: Update submodules from origin
      run: git submodule update --recursive --remote

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.

        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    - name: Build Application using script
      run: ${{matrix.platform.prefix}} python3 build.py --dependencies --configure --build ${{matrix.platform.extraflags}}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
